services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    # Porta 5433 no host para nao conflitar com o Postgres local (5432).
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${BACKEND_PORT:-3001}
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # URL publica HTTPS usada pelo Telegram para chamar o webhook.
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # Aumenta o rate limit da API/editor para setups automatizados locais.
      N8N_API_RATE_LIMIT_MAX: 1000
      N8N_API_RATE_LIMIT_DURATION: 60
      # Permite usar ={{ $env.N8N_WEBHOOK_SECRET }} nos nos (p/ assinar o
      # webhook com X-Webhook-Secret). Bloqueado por padrao no n8n 1.x.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:
